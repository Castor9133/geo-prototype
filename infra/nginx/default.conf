server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;
    port_in_redirect on;

    # Re-resolve Docker service DNS so api IP changes after recreate don't stick as 502.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $georank_api "http://api:8000";

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = / {
        root /usr/share/nginx/custom_homepage;
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        try_files /active/index.html @default_homepage;
    }

    location @default_homepage {
        return 302 /suite;
    }

    location ^~ /_custom_homepage/ {
        root /usr/share/nginx/custom_homepage;
        add_header X-Content-Type-Options "nosniff" always;
        rewrite ^/_custom_homepage/(.*)$ /$1 break;
        try_files $uri =404;
    }

    location ~* \.(js|css)$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        try_files $uri =404;
    }

    location ~* \.(png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location /components/ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass $georank_api;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location ~ "^/(?:manage|console|backend|control|dashboard|admin-[A-Za-z0-9][A-Za-z0-9_-]{1,42})(/.*)?$" {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        rewrite "^/(?:manage|console|backend|control|dashboard|admin-[A-Za-z0-9][A-Za-z0-9_-]{1,42})(/.*)?$" /admin$1 break;
        try_files $uri $uri.html $uri/ /admin/index.html;
    }

    location = /admin {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files /admin/index.html =404;
    }

    # Retired admin product surfaces → dashboard
    location = /admin/companies { return 301 /admin/; }
    location = /admin/experts { return 301 /admin/; }
    location = /admin/tutorials { return 301 /admin/; }
    location = /admin/tutorials-edit { return 301 /admin/; }
    location = /admin/solutions { return 301 /admin/; }
    location ^~ /admin/companies/ { return 301 /admin/; }
    location ^~ /admin/experts/ { return 301 /admin/; }
    location ^~ /admin/tutorials/ { return 301 /admin/; }
    location ^~ /admin/solutions/ { return 301 /admin/; }

    location ^~ /admin/ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri.html $uri/ /admin/index.html;
    }

    location = /index {
        return 301 /suite$is_args$args;
    }

    location = /index.html {
        return 301 /suite$is_args$args;
    }

    location = /company.html {
        return 301 /suite;
    }

    location = /diagnostic.html {
        return 301 /diagnostic$is_args$args;
    }

    location = /solutions.html {
        return 301 /suite;
    }

    location = /plans.html {
        return 301 /suite;
    }

    location = /qa {
        return 301 /suite;
    }

    location ^~ /qa/ {
        return 301 /suite;
    }

    location = /tutorial.html {
        return 301 /suite;
    }

    location = /tutorials {
        return 301 /suite;
    }

    location ^~ /tutorials/ {
        return 301 /suite;
    }

    location = /keywords.html {
        return 301 /keywords;
    }

    location = /tools.html {
        return 301 /suite;
    }

    location = /experts.html {
        return 301 /suite;
    }

    location = /profile.html {
        return 301 /profile;
    }

    location = /company-submit.html {
        return 301 /suite;
    }

    location = /company {
        return 301 /suite;
    }

    location = /companies {
        return 301 /suite;
    }

    location = /diagnostic {
        if ($arg_report != "") {
            return 301 /diagnostic/reports/$arg_report;
        }
        if ($arg_report_id != "") {
            return 301 /diagnostic/reports/$arg_report_id;
        }
        try_files /diagnostic.html =404;
    }

    location = /solutions {
        return 301 /suite;
    }

    location = /plans {
        return 301 /suite;
    }

    location = /tutorial {
        return 301 /suite;
    }

    location = /keywords {
        try_files /keywords.html =404;
    }

    location = /tools {
        return 301 /suite;
    }

    location ^~ /tools/ {
        return 301 /suite;
    }

    location = /experts {
        return 301 /suite;
    }

    location ^~ /experts/ {
        return 301 /suite;
    }

    location = /profile {
        try_files /profile.html =404;
    }

    location = /submit-company {
        return 301 /suite;
    }

    location = /company-submit {
        return 301 /suite;
    }

    location = /login {
        try_files /login.html =404;
    }

    location = /register {
        try_files /register.html =404;
    }

    location = /login.html {
        return 301 /login$is_args$args;
    }

    location = /register.html {
        return 301 /register$is_args$args;
    }

    location = /login/ {
        return 301 /login$is_args$args;
    }

    location = /register/ {
        return 301 /register$is_args$args;
    }

    location ^~ /companies/ {
        return 301 /suite;
    }

    location ^~ /c/ {
        return 301 /suite;
    }

    location ^~ /diagnostic/reports/ {
        try_files /diagnostic.html =404;
    }

    location ^~ /solutions/ {
        return 301 /suite;
    }

    location ^~ /plans/ {
        return 301 /suite;
    }

    location ^~ /tutorial/ {
        return 301 /suite;
    }

    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    location /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok";
    }
}
