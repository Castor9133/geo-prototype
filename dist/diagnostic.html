<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <title>SEO 检查 - GEOrank</title>
    <meta name="description" content="输入网址，查看基础 SEO 就绪情况。">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet">

        <link rel="stylesheet" href="/css/public-tailwind.css?v=20260729-seoslim1">
        <link rel="stylesheet" href="/css/common.css?v=20260729-seoslim1">
        <link rel="stylesheet" href="/css/suite-cockpit.css?v=20260730-diagobs1">
        <link rel="stylesheet" href="/css/diagnostic.css?v=20260730-diagobs1">
</head>
<body class="diagnostic-page bg-white text-on-surface antialiased">
    <div id="header-container"></div>

    <main class="max-w-7xl mx-auto px-4 md:px-6 lg:px-8 pt-24 md:pt-32 pb-16 md:pb-24">
        <section class="diag-hero">
            <p class="diag-hero__eyebrow">党建党媒 · 查页面</p>
            <h1>查页面问题</h1>
            <p class="diag-hero__lead">先查官网/栏目页缺口。检查完成后可一键新建选题，报告会自动挂上。</p>
            <div class="diag-search">
                <div class="diag-search__field">
                    <span class="material-symbols-outlined text-lg" aria-hidden="true">language</span>
                    <input id="url-input" placeholder="https://www.dji.com/cn 或 example.com" type="text" autocomplete="url" aria-label="检查目标 URL">
                </div>
                <button id="diagnose-btn" class="btn btn-primary text-sm font-bold" type="button">开始检查</button>
            </div>
            <p style="margin:0.75rem 0 0"><a class="btn" href="/strategies">检查完 → 去选题策略挂报告</a></p>
            <p id="diagnostic-status-note" class="hidden"></p>
        </section>

        <section id="diagnostic-report-shell" class="diagnostic-report-shell relative">
            <div id="diagnostic-report-banner" class="diag-card diag-zone-blue mb-6 md:mb-8 flex flex-col gap-4 px-5 py-5 md:flex-row md:items-start md:justify-between md:px-6">
                <div class="max-w-2xl">
                    <p id="diagnostic-report-mode-eyebrow" class="diag-eyebrow text-[11px] font-extrabold uppercase tracking-[0.14em]">示例报告</p>
                    <h2 id="diagnostic-report-mode-title" class="diag-section-title mt-2 text-xl md:text-2xl tracking-tight">基础 SEO 检查示例</h2>
                    <p id="diagnostic-report-mode-copy" class="mt-3 text-sm leading-7 text-on-surface-variant">
                        输入真实网址并开始检查后，将替换为该页的抓取结果。
                    </p>
                </div>
                <div class="diag-chip self-start">
                    <span id="diagnostic-report-mode-icon" class="material-symbols-outlined text-sm">visibility</span>
                    <span id="diagnostic-report-mode-chip">示例</span>
                </div>
            </div>

            <div id="diagnostic-transition-overlay" class="diagnostic-transition-overlay hidden" aria-hidden="true">
                <div class="diagnostic-transition-card">
                    <div class="diagnostic-transition-spinner"></div>
                    <div>
                        <p class="text-sm font-bold">正在抓取页面</p>
                        <p id="diagnostic-transition-copy" class="mt-1 text-xs leading-6 text-on-surface-variant">检测可抓取性、结构、内链与页面体量…</p>
                    </div>
                </div>
            </div>

            <div class="diag-tabs" role="tablist" aria-label="检查类型">
                <button type="button" class="diag-tab is-active" role="tab" aria-selected="true" data-diag-tab="seo" id="diag-tab-seo">SEO</button>
                <button type="button" class="diag-tab" role="tab" aria-selected="false" data-diag-tab="geo" id="diag-tab-geo">GEO 观测</button>
                <span class="diag-demo-badge">初诊=观测</span>
            </div>

            <div id="diag-panel-seo" class="diag-tab-panel" data-diag-panel="seo" role="tabpanel">
                <div class="grid grid-cols-12 gap-6" id="results-grid">
                    <div class="col-span-12" id="seo-priority">
                        <div class="diag-card diag-zone-blue p-5 md:p-6">
                            <p class="diag-eyebrow text-[11px] font-extrabold uppercase tracking-[0.16em]">优先建议</p>
                            <p id="diagnostic-summary-priority" class="mt-2 text-sm md:text-base leading-7 font-semibold">先补齐 FAQPage 与关键 Meta，再强化内链与权威外链。</p>
                        </div>
                    </div>
                    <div class="col-span-12" id="seo-modules-grid"></div>
                    <div class="col-span-12 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
                        <p class="text-sm text-on-surface-variant">检查完成后可直接新建选题，再到定策页补全。</p>
                        <div class="flex gap-3">
                            <button id="diagnostic-export-btn" class="btn btn-outline px-4 py-2 rounded-lg text-xs font-bold hidden" type="button" hidden>导出</button>
                            <button id="diagnostic-create-strategy-btn" class="btn btn-primary px-4 py-2 rounded-lg text-xs font-bold" type="button" hidden>用于新建选题</button>
                            <a id="diagnostic-to-solutions-btn" href="/strategies" class="btn btn-outline px-4 py-2 rounded-lg text-xs font-bold text-center">去选题策略</a>
                        </div>
                    </div>
                </div>
            </div>

            <div id="diag-panel-geo" class="diag-tab-panel hidden" data-diag-panel="geo" role="tabpanel" hidden>
                <div id="geo-observe-root" class="diag-observe-host"></div>
            </div>
        </section>
    </main>

    <div id="footer-container"></div>

    <script src="/js/common.js?v=20260729-navfast1" defer></script>
    <script src="/js/suite-workflow.js?v=20260730-nobar1" defer></script>
    <script src="/js/suite-extra.js?v=20260730-diagobs1" defer></script>
    <script src="/js/diagnostic.js?v=20260804-newstrat1" defer></script>
</body>
</html>
