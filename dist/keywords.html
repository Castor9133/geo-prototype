<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <title>GEO 拓词工具 - GEORank</title>
    <meta name="description" content="从种子关键词出发，按八大维度生成高价值 GEO 优化词包，提升 AI 搜索可见性。">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/css/public-tailwind.css?v=20260727-hard-shadow">
    <link rel="stylesheet" href="/css/common.css?v=20260727-hard-shadow">
    <link rel="stylesheet" href="/css/keywords.css?v=20260727-hard-shadow">
</head>
<body class="keywords-page bg-white text-on-surface antialiased">
    <div id="header-container"></div>

    <main class="max-w-7xl mx-auto px-4 md:px-6 lg:px-8 pt-24 md:pt-32 pb-16 md:pb-24">
        <section class="kw-hero">
            <h1>GEO 拓词工具</h1>
            <p class="kw-hero__lead">
                围绕意图与场景扩展查询词与提示词簇，为后续分发提供可控词表。
            </p>
            <div class="kw-search">
                <div id="tag-input-wrapper">
                    <span class="material-symbols-outlined text-slate-500 mr-1 text-lg">search</span>
                    <input id="keyword-input" class="flex-1 min-w-[120px] border-none focus:ring-0 bg-transparent placeholder:text-slate-400 py-1 text-sm" placeholder="输入关键词，按 Enter 添加" type="text">
                </div>
                <button id="generate-btn" class="btn btn-primary px-6 py-3 text-sm font-bold">生成词包</button>
            </div>
            <p id="keyword-feedback" class="hidden max-w-2xl mt-3 text-left text-sm text-rose-600"></p>
        </section>

        <div id="results-panel" class="hidden">
            <div class="kw-results-head flex flex-col sm:flex-row sm:items-end sm:justify-between gap-4 mb-6">
                <div>
                    <h2 class="text-xl md:text-2xl tracking-tight">拓词结果</h2>
                    <p class="text-sm text-on-surface-variant mt-1">为 "<span id="seed-kw-display" class="font-medium text-on-surface"></span>" 生成了 <span id="total-kw-count" class="font-bold text-on-surface">0</span> 个拓展关键词</p>
                </div>
                <div class="flex flex-wrap gap-3">
                    <button id="refine-btn" class="btn btn-outline px-4 py-2 text-xs font-bold inline-flex items-center gap-1.5"><span class="material-symbols-outlined text-sm">refresh</span>重新生成</button>
                    <button id="send-geoflow-btn" class="btn btn-outline px-4 py-2 text-xs font-bold inline-flex items-center gap-1.5"><span class="material-symbols-outlined text-sm">sync_alt</span>发送到 GEOFlow</button>
                    <button id="download-csv-btn" class="btn btn-primary px-4 py-2 text-xs font-bold inline-flex items-center gap-1.5"><span class="material-symbols-outlined text-sm">download</span>批量导出</button>
                </div>
            </div>

            <div id="keyword-profile-card" class="kw-profile-card hidden mb-6 p-5 md:p-6">
                <div class="flex flex-col gap-4 md:flex-row md:items-start md:justify-between">
                    <div class="max-w-2xl">
                        <p class="kw-profile-eyebrow text-[11px] font-extrabold uppercase">AI 识别画像</p>
                        <h3 id="keyword-profile-name" class="mt-2 text-xl font-bold tracking-tight">企业服务</h3>
                        <p id="keyword-profile-hint" class="mt-2 text-sm leading-7 text-on-surface-variant"></p>
                        <p id="keyword-profile-strategy" class="mt-3 text-sm leading-7 text-on-surface-variant"></p>
                    </div>
                    <div class="grid gap-3 sm:grid-cols-2 md:w-[26rem]">
                        <div class="kw-profile-mini">
                            <p class="text-[11px] font-bold uppercase tracking-[0.1em] text-on-surface-variant">业务模型</p>
                            <p id="keyword-profile-model" class="mt-2 text-sm font-semibold"></p>
                        </div>
                        <div class="kw-profile-mini">
                            <p class="text-[11px] font-bold uppercase tracking-[0.1em] text-on-surface-variant">目标用户</p>
                            <div id="keyword-profile-audience" class="mt-2 flex flex-wrap gap-2"></div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-8">
                <div class="kw-stat kw-stat--blue">
                    <div class="flex items-center justify-between mb-2">
                        <span class="text-xs font-medium text-on-surface-variant">总关键词</span>
                        <span class="kw-stat__icon"><span class="material-symbols-outlined text-sm">bar_chart</span></span>
                    </div>
                    <p class="text-2xl font-extrabold" id="stat-total">0</p>
                    <p class="trend text-xs mt-1 flex items-center gap-1"><span class="material-symbols-outlined text-xs">trending_up</span>8 个维度覆盖</p>
                </div>
                <div class="kw-stat kw-stat--blue">
                    <div class="flex items-center justify-between mb-2">
                        <span class="text-xs font-medium text-on-surface-variant">平均推荐指数</span>
                        <span class="kw-stat__icon"><span class="material-symbols-outlined text-sm">recommend</span></span>
                    </div>
                    <p class="text-2xl font-extrabold"><span id="stat-avg-rec">0</span><span class="text-sm font-normal text-on-surface-variant">/100</span></p>
                    <p class="trend text-xs mt-1 flex items-center gap-1"><span class="material-symbols-outlined text-xs">trending_up</span>高价值词占比 <span id="stat-high-rec">0</span>%</p>
                </div>
                <div class="kw-stat kw-stat--orange">
                    <div class="flex items-center justify-between mb-2">
                        <span class="text-xs font-medium text-on-surface-variant">平均商业指数</span>
                        <span class="kw-stat__icon"><span class="material-symbols-outlined text-sm">payments</span></span>
                    </div>
                    <p class="text-2xl font-extrabold"><span id="stat-avg-biz">0</span><span class="text-sm font-normal text-on-surface-variant">/100</span></p>
                    <p class="trend text-xs mt-1 flex items-center gap-1"><span class="material-symbols-outlined text-xs">trending_up</span>商业意图词占比 <span id="stat-high-biz">0</span>%</p>
                </div>
            </div>

            <div id="dim-grid" class="grid grid-cols-1 md:grid-cols-2 gap-5"></div>
        </div>

        <div id="skeleton-loading" class="hidden">
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-8">
                <div class="skeleton-pulse h-24"></div>
                <div class="skeleton-pulse h-24"></div>
                <div class="skeleton-pulse h-24"></div>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                <div class="skeleton-pulse h-64"></div>
                <div class="skeleton-pulse h-64"></div>
                <div class="skeleton-pulse h-64"></div>
                <div class="skeleton-pulse h-64"></div>
                <div class="skeleton-pulse h-64"></div>
                <div class="skeleton-pulse h-64"></div>
                <div class="skeleton-pulse h-64"></div>
                <div class="skeleton-pulse h-64"></div>
            </div>
        </div>
    </main>

    <div id="footer-container"></div>
    <script src="/js/common.js?v=20260727-hard-shadow"></script>
    <script src="/js/suite-workflow.js?v=20260727-hard-shadow"></script>
    <script src="/js/geoflow-handoff.js?v=20260727-hard-shadow"></script>
    <script src="/js/keywords.js?v=20260727-hard-shadow"></script>
</body>
</html>
